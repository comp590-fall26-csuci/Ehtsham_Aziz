- name: Lab6 - Configure Debian VM
  hosts: lab6
  become: true

  tasks:
    - name: Install asciinema
      ansible.builtin.apt:
        name: asciinema
        state: present

    - name: Install Apache2
      ansible.builtin.apt:
        name: apache2
        state: present

    - name: Enable and start Apache2
      ansible.builtin.service:
        name: apache2
        enabled: true
        state: started

    - name: Display completion message
      ansible.builtin.debug:
        msg: "Lab6 Completed! Apache2 is installed and running!
"
